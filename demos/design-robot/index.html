<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design the Next Robot | moedotfun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --bg: #090d16;
            --card-bg: rgba(22, 31, 49, 0.7);
            --border: rgba(255, 255, 255, 0.12);
            --text-main: #f3f4f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at center, #111827 0%, #080c14 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 4rem;
        }

        header {
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 1.25rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-link {
            color: #9ca3af;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent);
        }

        main {
            max-width: 1200px;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
        }

        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .preview-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(12px);
            position: relative;
            min-height: 520px;
        }

        .robot-stage {
            width: 320px;
            height: 380px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* SVG Robot Parts Styling */
        .robot-aura {
            position: absolute;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: var(--accent-glow);
            filter: blur(50px);
            z-index: 0;
            transition: background 0.3s ease;
        }

        .robot-head {
            position: relative;
            z-index: 2;
            transition: all 0.3s;
        }

        .robot-face {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.2rem;
            z-index: 3;
            user-select: none;
        }

        .robot-body {
            position: relative;
            z-index: 2;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .robot-arms {
            position: absolute;
            width: 100%;
            display: flex;
            justify-content: space-between;
            top: 130px;
            z-index: 3;
            font-size: 3rem;
            padding: 0 10px;
        }

        .robot-base {
            position: relative;
            z-index: 1;
            margin-top: 5px;
            font-size: 3.5rem;
            transition: all 0.3s;
        }

        /* Customize Panel */
        .controls-panel {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .control-group {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.25rem 1.5rem;
        }

        .group-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 0.5rem;
        }

        .option-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.6rem 0.8rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .option-btn:hover {
            background: rgba(255,255,255,0.12);
        }

        .option-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .stats-box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
            margin-top: 1.5rem;
            width: 100%;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 0.75rem;
        }

        .stat-item {
            font-family: 'JetBrains Mono', monospace;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #9ca3af;
            text-transform: uppercase;
        }

        .stat-val {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--accent);
        }

        .color-picker {
            display: flex;
            gap: 0.75rem;
        }

        .color-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s;
        }

        .color-dot:hover {
            transform: scale(1.15);
        }

        .color-dot.active {
            border-color: #ffffff;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="../../index.html" class="back-link">← Back to moedotfun</a>
            <h1 style="font-size: 1.4rem; font-weight: 800;">Design the Next Robot 🤖</h1>
            <div></div>
        </div>
    </header>

    <main>
        <section class="preview-panel">
            <div class="robot-stage">
                <div class="robot-aura" id="r-aura"></div>
                <div class="robot-head" id="r-head">
                    <svg width="120" height="90" viewBox="0 0 120 90">
                        <rect id="head-shape" x="10" y="10" width="100" height="70" rx="20" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
                    </svg>
                    <div class="robot-face" id="r-face">😊</div>
                </div>
                <div class="robot-arms">
                    <span id="r-arm-l">🦾</span>
                    <span id="r-arm-r">🦾</span>
                </div>
                <div class="robot-body" id="r-body">
                    <svg width="140" height="110" viewBox="0 0 140 110">
                        <rect id="body-shape" x="15" y="10" width="110" height="90" rx="15" fill="#1e293b" stroke="#ffffff" stroke-width="2"/>
                        <circle cx="70" cy="55" r="20" fill="#3b82f6" opacity="0.8"/>
                    </svg>
                </div>
                <div class="robot-base" id="r-base">🚀</div>
            </div>

            <div class="stats-box">
                <h3 style="font-size: 1.1rem; font-weight: 800;">Robot Spec Breakdown</h3>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-label">AI Processing</div>
                        <div class="stat-val" id="stat-flops">9,400 PFLOPS</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Chaos Factor</div>
                        <div class="stat-val" id="stat-chaos">12%</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Coffee Brew Speed</div>
                        <div class="stat-val" id="stat-coffee">45 cups/min</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Coolness Index</div>
                        <div class="stat-val" id="stat-cool">OVER 9000</div>
                    </div>
                </div>
            </div>
        </section>

        <section class="controls-panel">
            <div class="control-group">
                <div class="group-title">1. Aura Glow Color</div>
                <div class="color-picker" id="color-picker">
                    <div class="color-dot active" style="background: #3b82f6;" data-color="#3b82f6" data-glow="rgba(59, 130, 246, 0.4)"></div>
                    <div class="color-dot" style="background: #ec4899;" data-color="#ec4899" data-glow="rgba(236, 72, 153, 0.4)"></div>
                    <div class="color-dot" style="background: #10b981;" data-color="#10b981" data-glow="rgba(16, 185, 129, 0.4)"></div>
                    <div class="color-dot" style="background: #f59e0b;" data-color="#f59e0b" data-glow="rgba(245, 158, 11, 0.4)"></div>
                    <div class="color-dot" style="background: #8b5cf6;" data-color="#8b5cf6" data-glow="rgba(139, 92, 246, 0.4)"></div>
                </div>
            </div>

            <div class="control-group">
                <div class="group-title">2. Facial Expression</div>
                <div class="options-grid" id="faces-grid"></div>
            </div>

            <div class="control-group">
                <div class="group-title">3. Arm Attachments</div>
                <div class="options-grid" id="arms-grid"></div>
            </div>

            <div class="control-group">
                <div class="group-title">4. Propulsion Base</div>
                <div class="options-grid" id="base-grid"></div>
            </div>
        </section>
    </main>

    <script>
        const faces = [
            { icon: "😊", name: "Happy LED" },
            { icon: "😎", name: "Cool Shades" },
            { icon: "👾", name: "Glitch Pixel" },
            { icon: "😍", name: "Heart Eyes" },
            { icon: "😜", name: "Wink & Tongue" },
            { icon: "🤖", name: "Classic Bot" }
        ];

        const arms = [
            { icon: "🦾", name: "Cyber Mech" },
            { icon: "⚡", name: "Laser Arc" },
            { icon: "☕", name: "Espresso Arms" },
            { icon: "🧲", name: "Magnet Claws" },
            { icon: "🎸", name: "Guitar Shredder" }
        ];

        const bases = [
            { icon: "🚀", name: "Rocket Jet" },
            { icon: "🛞", name: "Cyber Wheel" },
            { icon: "🛸", name: "Hover Disk" },
            { icon: "🦵", name: "Bipedal Legs" },
            { icon: "🚜", name: "Tank Treads" }
        ];

        const rFace = document.getElementById('r-face');
        const rArmL = document.getElementById('r-arm-l');
        const rArmR = document.getElementById('r-arm-r');
        const rBase = document.getElementById('r-base');
        const rAura = document.getElementById('r-aura');
        const headShape = document.getElementById('head-shape');

        function createOptions(items, containerId, onClick) {
            const container = document.getElementById(containerId);
            items.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = `option-btn ${index === 0 ? 'active' : ''}`;
                btn.textContent = `${item.icon} ${item.name}`;
                btn.onclick = () => {
                    container.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    onClick(item);
                    randomizeStats();
                };
                container.appendChild(btn);
            });
        }

        createOptions(faces, 'faces-grid', (item) => rFace.textContent = item.icon);
        createOptions(arms, 'arms-grid', (item) => {
            rArmL.textContent = item.icon;
            rArmR.textContent = item.icon;
        });
        createOptions(bases, 'base-grid', (item) => rBase.textContent = item.icon);

        // Color dots
        document.querySelectorAll('.color-dot').forEach(dot => {
            dot.onclick = () => {
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                const color = dot.dataset.color;
                const glow = dot.dataset.glow;
                document.documentElement.style.setProperty('--accent', color);
                document.documentElement.style.setProperty('--accent-glow', glow);
                headShape.setAttribute('fill', color);
                randomizeStats();
            };
        });

        function randomizeStats() {
            document.getElementById('stat-flops').textContent = `${(Math.random() * 50000 + 10000).toFixed(0)} PFLOPS`;
            document.getElementById('stat-chaos').textContent = `${(Math.random() * 90 + 5).toFixed(0)}%`;
            document.getElementById('stat-coffee').textContent = `${(Math.random() * 100 + 20).toFixed(0)} cups/min`;
        }
    </script>
</body>
</html>
