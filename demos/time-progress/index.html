<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Progress | moedotfun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090d16;
            --card-bg: rgba(22, 31, 49, 0.6);
            --border: rgba(255, 255, 255, 0.1);
            --cyan: #06b6d4;
            --purple: #a855f7;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at center, #111827 0%, #080c14 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 4rem;
        }

        header {
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 1.25rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--cyan);
        }

        .title-box h1 {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(90deg, #06b6d4, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        main {
            max-width: 900px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        .section-title {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin: 2rem 0 1rem 0;
        }

        .progress-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem 1.75rem;
            margin-bottom: 1.25rem;
            backdrop-filter: blur(10px);
            transition: border-color 0.2s, transform 0.2s;
        }

        .progress-card:hover {
            border-color: rgba(6, 182, 212, 0.4);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .card-name {
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-pct {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--cyan);
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
        }

        .bar-outer {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .bar-inner {
            height: 100%;
            background: linear-gradient(90deg, #06b6d4, #a855f7);
            border-radius: 999px;
            transition: width 0.1s linear;
        }

        .birthday-input-box {
            background: rgba(168, 85, 247, 0.1);
            border: 1px dashed rgba(168, 85, 247, 0.4);
            border-radius: 20px;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .birthday-input-box label {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .birthday-input-box input[type="date"] {
            background: #0f172a;
            border: 1px solid var(--border);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="../../index.html" class="back-link">← Back to moedotfun</a>
            <div class="title-box">
                <h1>Time Progress ⏳</h1>
            </div>
            <div></div>
        </div>
    </header>

    <main>
        <div class="section-title">Earth & Calendar Rhythms</div>
        <div id="progress-container"></div>

        <div class="section-title">Human Life Journey</div>
        <div class="birthday-input-box">
            <label for="birthdate">Select Your Birthday:</label>
            <input type="date" id="birthdate" value="2000-01-01">
        </div>
        <div class="progress-card">
            <div class="card-header">
                <div class="card-name">👤 Human Lifetime (Avg 80 Years)</div>
                <div class="card-pct" id="life-pct">0.000000%</div>
            </div>
            <div class="bar-outer">
                <div class="bar-inner" id="life-bar" style="width: 0%;"></div>
            </div>
        </div>

        <div class="section-title">Cosmic Scale</div>
        <div class="progress-card">
            <div class="card-header">
                <div class="card-name">☀️ Sun's Main Sequence Life (~10 Billion Years)</div>
                <div class="card-pct">46.030000%</div>
            </div>
            <div class="bar-outer">
                <div class="bar-inner" style="width: 46.03%;"></div>
            </div>
        </div>
    </main>

    <script>
        const metrics = [
            { id: 'sec', name: '⏱️ Current Minute', calc: (now) => (now.getSeconds() + now.getMilliseconds() / 1000) / 60 },
            { id: 'min', name: '⌛ Current Hour', calc: (now) => (now.getMinutes() * 60 + now.getSeconds()) / 3600 },
            { id: 'hour', name: '☀️ Current Day', calc: (now) => (now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds()) / 86400 },
            { id: 'week', name: '📅 Current Week', calc: (now) => {
                const day = (now.getDay() + 6) % 7; // Mon = 0
                const secInWeek = day * 86400 + now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
                return secInWeek / (7 * 86400);
            }},
            { id: 'month', name: '🗓️ Current Month', calc: (now) => {
                const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
                const secInMonth = (now.getDate() - 1) * 86400 + now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
                return secInMonth / (daysInMonth * 86400);
            }},
            { id: 'year', name: '🌎 Current Year (2026)', calc: (now) => {
                const startYear = new Date(now.getFullYear(), 0, 1);
                const endYear = new Date(now.getFullYear() + 1, 0, 1);
                return (now - startYear) / (endYear - startYear);
            }},
            { id: 'decade', name: '🚀 2020s Decade', calc: (now) => {
                const startDecade = new Date(2020, 0, 1);
                const endDecade = new Date(2030, 0, 1);
                return (now - startDecade) / (endDecade - startDecade);
            }},
            { id: 'century', name: '🌌 21st Century', calc: (now) => {
                const startCentury = new Date(2000, 0, 1);
                const endCentury = new Date(2100, 0, 1);
                return (now - startCentury) / (endCentury - startCentury);
            }}
        ];

        const container = document.getElementById('progress-container');

        // Create cards dynamically
        metrics.forEach(m => {
            const card = document.createElement('div');
            card.className = 'progress-card';
            card.innerHTML = `
                <div class="card-header">
                    <div class="card-name">${m.name}</div>
                    <div class="card-pct" id="pct-${m.id}">0.000000%</div>
                </div>
                <div class="bar-outer">
                    <div class="bar-inner" id="bar-${m.id}" style="width: 0%;"></div>
                </div>
            `;
            container.appendChild(card);
        });

        const birthdateInput = document.getElementById('birthdate');
        const lifePctElem = document.getElementById('life-pct');
        const lifeBarElem = document.getElementById('life-bar');

        function updateProgress() {
            const now = new Date();

            metrics.forEach(m => {
                const ratio = Math.min(1, Math.max(0, m.calc(now)));
                const pct = (ratio * 100).toFixed(6);
                document.getElementById(`pct-${m.id}`).textContent = `${pct}%`;
                document.getElementById(`bar-${m.id}`).style.width = `${ratio * 100}%`;
            });

            // Lifetime calculation
            const birthVal = new Date(birthdateInput.value);
            if (!isNaN(birthVal)) {
                const lifeSpanMs = 80 * 365.25 * 86400 * 1000;
                const elapsedMs = now - birthVal;
                const lifeRatio = Math.min(1, Math.max(0, elapsedMs / lifeSpanMs));
                const lifePct = (lifeRatio * 100).toFixed(6);
                lifePctElem.textContent = `${lifePct}%`;
                lifeBarElem.style.width = `${lifeRatio * 100}%`;
            }

            requestAnimationFrame(updateProgress);
        }

        requestAnimationFrame(updateProgress);
    </script>
</body>
</html>
