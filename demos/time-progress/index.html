<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time & Cosmic Progress | moedotfun</title>
    <meta name="description" content="Live real-time percentage progress of minute, day, year, life, and cosmic scales.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090d16;
            --card-bg: rgba(22, 31, 49, 0.6);
            --border: rgba(255, 255, 255, 0.1);
            --cyan: #06b6d4;
            --purple: #a855f7;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at center, #111827 0%, #080c14 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 5rem;
        }

        header {
            background: rgba(9, 13, 22, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 1.1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.2s;
            white-space: nowrap;
        }
        .back-link:hover { color: var(--cyan); }

        .header-title {
            font-size: 1.2rem;
            font-weight: 800;
            background: linear-gradient(90deg, #06b6d4, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }

        .btn-toggle-mode {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.4rem 0.9rem;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .btn-toggle-mode:hover {
            background: rgba(255,255,255,0.1);
            color: var(--text-main);
            border-color: rgba(255,255,255,0.2);
        }

        main {
            max-width: 900px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        .section-label {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text-muted);
            margin: 2.5rem 0 0.9rem 0;
            opacity: 0.55;
        }

        .progress-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.1rem 1.4rem;
            margin-bottom: 0.75rem;
            backdrop-filter: blur(10px);
            transition: border-color 0.2s, transform 0.2s;
        }
        .progress-card:hover {
            border-color: rgba(6, 182, 212, 0.25);
            transform: translateY(-1px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.7rem;
            gap: 1rem;
        }

        .card-meta { flex: 1; }

        .card-name {
            font-size: 1rem;
            font-weight: 700;
        }

        .card-sublabel {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 0.15rem;
            opacity: 0.6;
            letter-spacing: 0.2px;
        }

        .card-pct {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--cyan);
            text-shadow: 0 0 12px rgba(6, 182, 212, 0.3);
            white-space: nowrap;
        }

        .bar-outer {
            width: 100%;
            height: 9px;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 999px;
            overflow: hidden;
        }

        .bar-inner {
            height: 100%;
            background: linear-gradient(90deg, #06b6d4, #a855f7);
            border-radius: 999px;
            transition: width 0.08s linear;
        }

        .bar-inner.slow { transition: width 0.5s ease; }
        .bar-inner.static { transition: none; }

        /* Birthday block */
        .birthday-card {
            background: rgba(168, 85, 247, 0.06);
            border: 1px solid rgba(168, 85, 247, 0.18);
            border-radius: 16px;
            padding: 1.1rem 1.4rem;
            display: flex;
            align-items: center;
            gap: 1.25rem;
            flex-wrap: wrap;
            margin-bottom: 0.75rem;
        }

        .birthday-card label {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-main);
            white-space: nowrap;
        }

        .birthday-card input[type="date"] {
            background: rgba(9, 13, 22, 0.8);
            border: 1px solid rgba(168, 85, 247, 0.25);
            color: var(--text-main);
            padding: 0.4rem 0.9rem;
            border-radius: 9px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.88rem;
            outline: none;
            transition: border-color 0.2s;
            cursor: pointer;
        }
        .birthday-card input[type="date"]:focus {
            border-color: rgba(168, 85, 247, 0.5);
        }

        /* Life & cosmic bar variants */
        .bar-inner.life   { background: linear-gradient(90deg, #a855f7, #f59e0b); }
        .bar-inner.cosmic { background: linear-gradient(90deg, #f59e0b, #ef4444); }

        .static-tag {
            display: inline-block;
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            padding: 0.15rem 0.45rem;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 3px;
            margin-left: 0.4rem;
            vertical-align: middle;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="../../index.html" class="back-link">← Back to moedotfun</a>
            <h1 class="header-title">Time &amp; Cosmic Progress</h1>
            <button class="btn-toggle-mode" id="btn-toggle-mode">Show Remaining</button>
        </div>
    </header>

    <main>
        <div class="section-label">Earth &amp; Calendar Rhythms</div>
        <div id="container-fast"></div>
        <div id="container-slow"></div>

        <div class="section-label">Human Life Journey</div>
        <div class="birthday-card">
            <label for="birthdate">Your Birthday</label>
            <input type="date" id="birthdate" value="2000-01-01">
        </div>
        <div id="container-life"></div>

        <div class="section-label">Cosmic Scale</div>
        <div id="container-cosmic"></div>
    </main>

    <script>
        let showRemaining = false;

        // Fast metrics: updated via requestAnimationFrame (60fps)
        const fastMetrics = [
            {
                id: 'sec',
                name: 'Current Minute',
                sublabel: 'Real-time, 60fps',
                calc: n => (n.getSeconds() + n.getMilliseconds() / 1000) / 60
            },
            {
                id: 'min',
                name: 'Current Hour',
                sublabel: 'Real-time, 60fps',
                calc: n => (n.getMinutes() * 60 + n.getSeconds()) / 3600
            },
            {
                id: 'hour',
                name: 'Current Day',
                sublabel: 'Real-time, 60fps',
                calc: n => (n.getHours() * 3600 + n.getMinutes() * 60 + n.getSeconds()) / 86400
            }
        ];

        // Slow metrics: updated every 1 second
        const slowMetrics = [
            {
                id: 'week',
                name: 'Current Week',
                sublabel: 'Updated every second',
                calc: n => {
                    const day = (n.getDay() + 6) % 7;
                    return (day * 86400 + n.getHours() * 3600 + n.getMinutes() * 60 + n.getSeconds()) / (7 * 86400);
                }
            },
            {
                id: 'month',
                name: 'Current Month',
                sublabel: 'Updated every second',
                calc: n => {
                    const daysInMonth = new Date(n.getFullYear(), n.getMonth() + 1, 0).getDate();
                    const sec = (n.getDate() - 1) * 86400 + n.getHours() * 3600 + n.getMinutes() * 60 + n.getSeconds();
                    return sec / (daysInMonth * 86400);
                }
            },
            {
                id: 'year',
                name: () => `Current Year (${new Date().getFullYear()})`,
                sublabel: 'Updated every second',
                calc: n => {
                    const s = new Date(n.getFullYear(), 0, 1);
                    const e = new Date(n.getFullYear() + 1, 0, 1);
                    return (n - s) / (e - s);
                }
            },
            {
                id: 'decade',
                name: '2020s Decade',
                sublabel: 'Updated every second',
                calc: n => (n - new Date(2020, 0, 1)) / (new Date(2030, 0, 1) - new Date(2020, 0, 1))
            },
            {
                id: 'century',
                name: '21st Century',
                sublabel: 'Updated every second',
                calc: n => (n - new Date(2000, 0, 1)) / (new Date(2100, 0, 1) - new Date(2000, 0, 1))
            }
        ];

        // Cosmic: static (no live update needed)
        const cosmicMetrics = [
            {
                id: 'sun',
                name: "Sun's Main Sequence Life",
                sublabel: '~10 billion years total lifespan',
                value: 0.4603
            }
        ];

        function fmtPct(ratio) {
            const v = showRemaining ? (1 - ratio) : ratio;
            return (Math.min(1, Math.max(0, v)) * 100).toFixed(6) + '%';
        }

        function makeCard(container, id, name, sublabel, barClass = '') {
            const nameStr = typeof name === 'function' ? name() : name;
            const card = document.createElement('div');
            card.className = 'progress-card';
            card.innerHTML = `
                <div class="card-header">
                    <div class="card-meta">
                        <div class="card-name">${nameStr}</div>
                        <div class="card-sublabel">${sublabel}</div>
                    </div>
                    <div class="card-pct" id="pct-${id}">0.000000%</div>
                </div>
                <div class="bar-outer">
                    <div class="bar-inner${barClass ? ' ' + barClass : ''}" id="bar-${id}" style="width:0%"></div>
                </div>
            `;
            container.appendChild(card);
        }

        const containerFast   = document.getElementById('container-fast');
        const containerSlow   = document.getElementById('container-slow');
        const containerLife   = document.getElementById('container-life');
        const containerCosmic = document.getElementById('container-cosmic');

        fastMetrics.forEach(m => makeCard(containerFast, m.id, m.name, m.sublabel));
        slowMetrics.forEach(m => makeCard(containerSlow, m.id, m.name, m.sublabel, 'slow'));
        makeCard(containerLife, 'life', 'Human Lifetime', 'Based on 80-year average — real-time', 'life');

        cosmicMetrics.forEach(m => {
            makeCard(containerCosmic, m.id, m.name, m.sublabel + '<span class="static-tag">static</span>', 'cosmic static');
        });

        function setCard(id, ratio) {
            const pct = fmtPct(ratio);
            const w   = (showRemaining ? (1 - Math.min(1, Math.max(0, ratio))) : Math.min(1, Math.max(0, ratio))) * 100;
            document.getElementById(`pct-${id}`).textContent = pct;
            document.getElementById(`bar-${id}`).style.width = w + '%';
        }

        const birthdateInput = document.getElementById('birthdate');

        // RAF loop — fast metrics + life
        function updateFast() {
            const now = new Date();
            fastMetrics.forEach(m => setCard(m.id, m.calc(now)));

            const birth = new Date(birthdateInput.value);
            if (!isNaN(birth)) {
                const lifeRatio = (now - birth) / (80 * 365.25 * 86400 * 1000);
                setCard('life', lifeRatio);
            }
            requestAnimationFrame(updateFast);
        }

        // 1s interval — slow metrics
        function updateSlow() {
            const now = new Date();
            slowMetrics.forEach(m => setCard(m.id, m.calc(now)));
        }

        // Cosmic is static
        function updateCosmic() {
            cosmicMetrics.forEach(m => setCard(m.id, m.value));
        }

        requestAnimationFrame(updateFast);
        updateSlow();
        updateCosmic();
        setInterval(updateSlow, 1000);

        // Toggle mode
        document.getElementById('btn-toggle-mode').addEventListener('click', function () {
            showRemaining = !showRemaining;
            this.textContent = showRemaining ? 'Show Elapsed' : 'Show Remaining';
            updateSlow();
            updateCosmic();
        });
    </script>
</body>
</html>
