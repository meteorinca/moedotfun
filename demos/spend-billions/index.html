<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spend Tech Billions | moedotfun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090d16;
            --card-bg: rgba(22, 31, 49, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --accent-green: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.3);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top center, #111827 0%, #090d16 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 4rem;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 1.25rem 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent-green);
        }

        .money-header {
            text-align: center;
            flex-grow: 1;
        }

        .money-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }

        .money-amount {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--accent-green);
            text-shadow: 0 0 20px var(--accent-glow);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.08);
            border-radius: 999px;
            margin-top: 0.75rem;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #06b6d4);
            width: 0%;
            transition: width 0.3s ease;
        }

        .controls {
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }

        .btn-reset {
            border-color: rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }

        .btn-reset:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        main {
            max-width: 1200px;
            margin: 2.5rem auto 0 auto;
            padding: 0 1.5rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
            text-align: center;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(16, 185, 129, 0.4);
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
        }

        .item-icon {
            font-size: 3.5rem;
            margin-bottom: 0.75rem;
            user-select: none;
        }

        .item-name {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .item-cost {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-green);
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        .item-actions {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            gap: 0.5rem;
            align-items: center;
        }

        .btn-action {
            padding: 0.6rem;
            font-weight: 700;
            border-radius: 12px;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn-action:active {
            transform: scale(0.95);
        }

        .btn-sell {
            background: #ef4444;
            color: white;
        }

        .btn-sell:disabled {
            background: rgba(239, 68, 68, 0.2);
            color: rgba(255,255,255,0.3);
            cursor: not-allowed;
        }

        .btn-buy {
            background: var(--accent-green);
            color: #042f2e;
        }

        .btn-buy:disabled {
            background: rgba(16, 185, 129, 0.2);
            color: rgba(255,255,255,0.3);
            cursor: not-allowed;
        }

        .item-count {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            background: rgba(0,0,0,0.3);
            padding: 0.5rem;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .receipt-section {
            margin-top: 4rem;
            background: rgba(17, 24, 39, 0.8);
            border: 1px dashed rgba(255,255,255,0.2);
            border-radius: 24px;
            padding: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .receipt-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .receipt-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .receipt-item {
            display: flex;
            justify-content: space-between;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px rgba(255,255,255,0.05) solid;
        }

        .receipt-total {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 2px solid var(--accent-green);
            display: flex;
            justify-content: space-between;
            font-weight: 800;
            font-size: 1.2rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-green);
        }

        .empty-receipt {
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="../../index.html" class="back-link">← Back to moedotfun</a>
            <div class="money-header">
                <div class="money-title">Net Worth Remaining</div>
                <div class="money-amount" id="balance-display">$200,000,000,000</div>
            </div>
            <div class="controls">
                <button class="btn" id="btn-random">🎲 Random Buy</button>
                <button class="btn btn-reset" id="btn-reset">Reset</button>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>
    </header>

    <main>
        <div class="grid" id="items-grid"></div>

        <section class="receipt-section">
            <h2 class="receipt-title">Your Receipt 🧾</h2>
            <ul class="receipt-list" id="receipt-list">
                <li class="empty-receipt">You haven't bought anything yet! Start spending billions.</li>
            </ul>
            <div class="receipt-total">
                <span>Total Spent</span>
                <span id="receipt-total-val">$0</span>
            </div>
        </section>
    </main>

    <script>
        const INITIAL_MONEY = 200000000000;
        let money = INITIAL_MONEY;

        const items = [
            { id: 1, name: "Big Mac", cost: 5, icon: "🍔", count: 0 },
            { id: 2, name: "Flip Flops", cost: 15, icon: "🩴", count: 0 },
            { id: 3, name: "Video Game", cost: 60, icon: "🎮", count: 0 },
            { id: 4, name: "AirPods Max", cost: 550, icon: "🎧", count: 0 },
            { id: 5, name: "Gaming Rig PC", cost: 3500, icon: "🖥️", count: 0 },
            { id: 6, name: "Rolex Watch", cost: 14000, icon: "⌚", count: 0 },
            { id: 7, name: "Tesla Cybertruck", cost: 100000, icon: "📐", count: 0 },
            { id: 8, name: "Suburban Home", cost: 500000, icon: "🏡", count: 0 },
            { id: 9, name: "McDonald's Franchise", cost: 1500000, icon: "🍟", count: 0 },
            { id: 10, name: "Super Bowl Commercial", cost: 7000000, icon: "📺", count: 0 },
            { id: 11, name: "Tropical Private Island", cost: 18000000, icon: "🏝️", count: 0 },
            { id: 12, name: "Falcon Heavy Launch", cost: 90000000, icon: "🚀", count: 0 },
            { id: 13, name: "Boeing 747 Jet", cost: 400000000, icon: "✈️", count: 0 },
            { id: 14, name: "Mona Lisa Painting", cost: 860000000, icon: "🖼️", count: 0 },
            { id: 15, name: "NBA Franchise", cost: 3200000000, icon: "🏀", count: 0 },
            { id: 16, name: "AAA Gaming Studio", cost: 7500000000, icon: "👾", count: 0 },
            { id: 17, name: "AI Supercomputer Cluster", cost: 18000000000, icon: "🧠", count: 0 },
            { id: 18, name: "Commercial Moon Base", cost: 45000000000, icon: "🌕", count: 0 }
        ];

        function formatCurrency(val) {
            return '$' + val.toLocaleString('en-US');
        }

        const balanceDisplay = document.getElementById('balance-display');
        const progressBar = document.getElementById('progress-bar');
        const itemsGrid = document.getElementById('items-grid');
        const receiptList = document.getElementById('receipt-list');
        const receiptTotalVal = document.getElementById('receipt-total-val');

        function renderGrid() {
            itemsGrid.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="item-icon">${item.icon}</div>
                    <div class="item-name">${item.name}</div>
                    <div class="item-cost">${formatCurrency(item.cost)}</div>
                    <div class="item-actions">
                        <button class="btn-action btn-sell" onclick="sellItem(${item.id})" ${item.count === 0 ? 'disabled' : ''}>Sell</button>
                        <span class="item-count" id="count-${item.id}">${item.count}</span>
                        <button class="btn-action btn-buy" onclick="buyItem(${item.id})" ${money < item.cost ? 'disabled' : ''}>Buy</button>
                    </div>
                `;
                itemsGrid.appendChild(card);
            });
        }

        function updateUI() {
            balanceDisplay.textContent = formatCurrency(money);
            const spent = INITIAL_MONEY - money;
            const percentage = (spent / INITIAL_MONEY) * 100;
            progressBar.style.width = percentage + '%';

            // Update item counts and button states
            items.forEach(item => {
                const countElem = document.getElementById(`count-${item.id}`);
                if (countElem) {
                    countElem.textContent = item.count;
                    const card = countElem.closest('.card');
                    const sellBtn = card.querySelector('.btn-sell');
                    const buyBtn = card.querySelector('.btn-buy');
                    sellBtn.disabled = item.count === 0;
                    buyBtn.disabled = money < item.cost;
                }
            });

            // Receipt
            const boughtItems = items.filter(i => i.count > 0);
            if (boughtItems.length === 0) {
                receiptList.innerHTML = `<li class="empty-receipt">You haven't bought anything yet! Start spending billions.</li>`;
                receiptTotalVal.textContent = '$0';
            } else {
                receiptList.innerHTML = boughtItems.map(i => `
                    <li class="receipt-item">
                        <span>${i.icon} ${i.name} x${i.count}</span>
                        <span>${formatCurrency(i.cost * i.count)}</span>
                    </li>
                `).join('');
                receiptTotalVal.textContent = formatCurrency(spent);
            }
        }

        window.buyItem = function(id) {
            const item = items.find(i => i.id === id);
            if (item && money >= item.cost) {
                money -= item.cost;
                item.count++;
                updateUI();
            }
        };

        window.sellItem = function(id) {
            const item = items.find(i => i.id === id);
            if (item && item.count > 0) {
                money += item.cost;
                item.count--;
                updateUI();
            }
        };

        document.getElementById('btn-reset').addEventListener('click', () => {
            money = INITIAL_MONEY;
            items.forEach(i => i.count = 0);
            updateUI();
        });

        document.getElementById('btn-random').addEventListener('click', () => {
            const affordableItems = items.filter(i => i.cost <= money);
            if (affordableItems.length > 0) {
                const randomItem = affordableItems[Math.floor(Math.random() * affordableItems.length)];
                buyItem(randomItem.id);
            }
        });

        renderGrid();
        updateUI();
    </script>
</body>
</html>
