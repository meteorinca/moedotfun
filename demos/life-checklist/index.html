<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Milestones Checklist | moedotfun</title>
    <meta name="description" content="An interactive checklist of life's iconic moments. Track, unlock, and earn ranks.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090d16;
            --card-bg: rgba(22, 31, 49, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --accent: #f59e0b;
            --accent-dim: rgba(245, 158, 11, 0.08);
            --accent-border: rgba(245, 158, 11, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top center, #111827 0%, #090d16 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 5rem;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(9, 13, 22, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 1.1rem 2rem;
        }

        .header-content {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--accent); }

        .header-title {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 0.3px;
        }

        .btn-reset-all {
            background: none;
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: rgba(239, 68, 68, 0.6);
            padding: 0.38rem 0.9rem;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }
        .btn-reset-all:hover {
            background: rgba(239, 68, 68, 0.08);
            border-color: rgba(239, 68, 68, 0.5);
            color: #fca5a5;
        }

        main {
            max-width: 900px;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
        }

        /* HUD */
        .hud-card {
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 2rem 2rem 1.5rem;
            margin-bottom: 2.75rem;
            text-align: center;
            backdrop-filter: blur(12px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
        }

        .hud-pct {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3.75rem;
            font-weight: 800;
            color: var(--accent);
            text-shadow: 0 0 30px rgba(245, 158, 11, 0.35);
            line-height: 1;
            margin-bottom: 0.5rem;
            transition: text-shadow 0.3s;
        }

        .hud-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 1.25rem;
        }

        .progress-outer {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 1.25rem;
        }

        .progress-inner {
            height: 100%;
            background: linear-gradient(90deg, #f59e0b, #ef4444);
            width: 0%;
            border-radius: 999px;
            transition: width 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .badge-box {
            display: inline-flex;
            align-items: center;
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 0.45rem 1.25rem;
            border-radius: 999px;
            font-weight: 800;
            font-size: 0.8rem;
            color: #fde68a;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.4s;
        }

        .save-note {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 0.9rem;
            opacity: 0.45;
            letter-spacing: 0.4px;
        }

        /* Categories */
        .category-block {
            margin-bottom: 2.5rem;
        }

        .category-title {
            font-size: 0.72rem;
            font-weight: 700;
            margin-bottom: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2.5px;
            padding-left: 0.9rem;
            border-left: 2px solid var(--accent);
        }

        .checklist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 0.65rem;
        }

        .check-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 13px;
            padding: 0.85rem 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            user-select: none;
            transition: border-color 0.2s, background 0.2s, transform 0.15s;
        }

        .check-item:hover {
            border-color: var(--accent-border);
            transform: translateY(-1px);
        }

        .check-item.checked {
            background: var(--accent-dim);
            border-color: var(--accent-border);
        }

        .checkbox-custom {
            width: 20px;
            height: 20px;
            min-width: 20px;
            border-radius: 5px;
            border: 1.5px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 900;
            transition: all 0.18s;
            color: #000;
        }

        .check-item.checked .checkbox-custom {
            background: var(--accent);
            border-color: var(--accent);
        }

        .item-label {
            font-size: 0.88rem;
            font-weight: 600;
            line-height: 1.35;
            color: var(--text-main);
            transition: opacity 0.2s;
        }

        .check-item.checked .item-label {
            opacity: 0.5;
            text-decoration: line-through;
            text-decoration-color: rgba(245, 158, 11, 0.5);
        }

        /* Confetti */
        .confetti-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }

        .confetti-piece {
            position: absolute;
            top: -12px;
            border-radius: 2px;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0%   { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
            80%  { opacity: 1; }
            100% { transform: translateY(105vh) rotate(800deg) scale(0.7); opacity: 0; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="../../index.html" class="back-link">← Back to moedotfun</a>
            <h1 class="header-title">Life Milestones</h1>
            <button class="btn-reset-all" id="btn-reset-all">Reset All</button>
        </div>
    </header>

    <main>
        <div class="hud-card">
            <div class="hud-pct" id="total-pct">0%</div>
            <div class="hud-subtitle" id="total-counts">0 of 25 completed</div>
            <div class="progress-outer">
                <div class="progress-inner" id="progress-bar"></div>
            </div>
            <div class="badge-box" id="badge-display">Rank: Beginner</div>
            <div class="save-note">Progress saves automatically in this browser</div>
        </div>

        <div id="checklist-categories"></div>
    </main>

    <div class="confetti-layer" id="confetti-layer"></div>

    <script>
        const categories = [
            {
                title: "Early Wonders & Childhood",
                items: [
                    "Ride a bicycle without training wheels",
                    "Build a giant pillow and blanket fort",
                    "See the ocean in person for the first time",
                    "Sleep outside under the stars",
                    "Fly a kite high up in the sky"
                ]
            },
            {
                title: "Tech, Craft & Ingenuity",
                items: [
                    "Write your very first line of computer code",
                    "Build or customize a desktop PC",
                    "Publish an interactive project on moedotfun",
                    "Pull a focused coding all-nighter",
                    "Solder an electronic circuit board"
                ]
            },
            {
                title: "Adventure & World Exploration",
                items: [
                    "Travel to a foreign country",
                    "Hike to the summit of a mountain",
                    "Witness a total solar eclipse or aurora borealis",
                    "Complete an epic cross-country road trip",
                    "Swim with dolphins or wild marine life"
                ]
            },
            {
                title: "Creativity & Mastery",
                items: [
                    "Learn to play a song on a musical instrument",
                    "Solve a Rubik's cube unaided",
                    "Cook a gourmet 3-course dinner from scratch",
                    "Read 50 books in a year",
                    "Mentor someone and teach them a new skill"
                ]
            },
            {
                title: "Epic Life Achievements",
                items: [
                    "Fly a high-speed drone",
                    "Run a 10K or marathon race",
                    "Adopt a pet",
                    "Start your own passion project or business",
                    "Bungee jump or skydive"
                ]
            }
        ];

        let checkedMap = JSON.parse(localStorage.getItem('moe_life_checklist') || '{}');
        let confettiShown = false;

        const totalItemCount = categories.reduce((sum, c) => sum + c.items.length, 0);

        const totalPctElem  = document.getElementById('total-pct');
        const totalCountsElem = document.getElementById('total-counts');
        const progressBar   = document.getElementById('progress-bar');
        const badgeDisplay  = document.getElementById('badge-display');
        const categoriesContainer = document.getElementById('checklist-categories');

        function updateStats() {
            const checkedCount = Object.values(checkedMap).filter(Boolean).length;
            const pct = Math.round((checkedCount / totalItemCount) * 100);

            totalPctElem.textContent = `${pct}%`;
            totalCountsElem.textContent = `${checkedCount} of ${totalItemCount} completed`;
            progressBar.style.width = `${pct}%`;

            let rank = 'Beginner';
            if      (pct >= 80) rank = 'Legend';
            else if (pct >= 50) rank = 'Master';
            else if (pct >= 25) rank = 'Veteran';
            else if (pct >= 10) rank = 'Explorer';

            badgeDisplay.textContent = `Rank: ${rank}`;

            if (pct === 100 && !confettiShown) {
                confettiShown = true;
                launchConfetti();
            } else if (pct < 100) {
                confettiShown = false;
            }
        }

        function launchConfetti() {
            const layer  = document.getElementById('confetti-layer');
            const colors = ['#f59e0b', '#06b6d4', '#10b981', '#e2e8f0', '#a855f7', '#f43f5e'];
            for (let i = 0; i < 90; i++) {
                const p = document.createElement('div');
                p.className = 'confetti-piece';
                const size = Math.random() * 7 + 4;
                p.style.cssText = `
                    left: ${Math.random() * 100}%;
                    width: ${size}px;
                    height: ${size}px;
                    background: ${colors[Math.floor(Math.random() * colors.length)]};
                    animation-duration: ${Math.random() * 1.8 + 1.4}s;
                    animation-delay: ${Math.random() * 0.6}s;
                `;
                layer.appendChild(p);
                p.addEventListener('animationend', () => p.remove());
            }
        }

        function renderChecklist() {
            categoriesContainer.innerHTML = '';

            categories.forEach((cat, catIdx) => {
                const block = document.createElement('div');
                block.className = 'category-block';

                const titleEl = document.createElement('div');
                titleEl.className = 'category-title';
                titleEl.textContent = cat.title;
                block.appendChild(titleEl);

                const grid = document.createElement('div');
                grid.className = 'checklist-grid';

                cat.items.forEach((itemText, itemIdx) => {
                    const key       = `${catIdx}-${itemIdx}`;
                    const isChecked = !!checkedMap[key];

                    const card = document.createElement('div');
                    card.className = `check-item${isChecked ? ' checked' : ''}`;

                    const box = document.createElement('div');
                    box.className = 'checkbox-custom';
                    box.textContent = isChecked ? '✓' : '';

                    const label = document.createElement('div');
                    label.className = 'item-label';
                    label.textContent = itemText;

                    card.appendChild(box);
                    card.appendChild(label);

                    card.addEventListener('click', () => {
                        const next = !checkedMap[key];
                        checkedMap[key] = next;
                        localStorage.setItem('moe_life_checklist', JSON.stringify(checkedMap));

                        if (next) {
                            card.classList.add('checked');
                            box.textContent = '✓';
                        } else {
                            card.classList.remove('checked');
                            box.textContent = '';
                        }

                        updateStats();
                    });

                    grid.appendChild(card);
                });

                block.appendChild(grid);
                categoriesContainer.appendChild(block);
            });
        }

        document.getElementById('btn-reset-all').addEventListener('click', () => {
            if (confirm('Reset all milestones? This cannot be undone.')) {
                checkedMap     = {};
                confettiShown  = false;
                localStorage.setItem('moe_life_checklist', JSON.stringify(checkedMap));
                renderChecklist();
                updateStats();
            }
        });

        renderChecklist();
        updateStats();
    </script>
</body>
</html>
