<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Deep Sea | moedotfun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --depth-color: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
            background-color: #030712;
            overflow-x: hidden;
            position: relative;
        }

        #depth-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            transition: background 0.3s ease;
            background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
        }

        .hud-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(3, 7, 18, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .back-link {
            color: #9ca3af;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #38bdf8;
        }

        .depth-hud {
            text-align: center;
        }

        .depth-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--depth-color);
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }

        .zone-name {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #e2e8f0;
        }

        .ocean-column {
            position: relative;
            width: 100%;
            height: 25000px; /* Scaled scroll canvas */
            max-width: 900px;
            margin: 0 auto;
            padding: 120px 20px 100px 20px;
        }

        .ruler {
            position: absolute;
            left: 50%;
            top: 100px;
            bottom: 100px;
            width: 2px;
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.05) 100%);
            transform: translateX(-50%);
        }

        .zone-banner {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 0.75rem 2rem;
            border-radius: 999px;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            backdrop-filter: blur(8px);
            z-index: 10;
        }

        .creature-card {
            position: absolute;
            width: calc(50% - 40px);
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 1.25rem 1.5rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .creature-card:hover {
            transform: scale(1.03);
            border-color: #38bdf8;
        }

        .creature-card.left {
            left: 0;
        }

        .creature-card.right {
            right: 0;
        }

        .creature-card::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 30px;
            height: 2px;
            background: rgba(255,255,255,0.3);
        }

        .creature-card.left::after {
            right: -30px;
        }

        .creature-card.right::after {
            left: -30px;
        }

        .creature-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .creature-name {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .creature-depth-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: #38bdf8;
            margin-bottom: 0.5rem;
        }

        .creature-desc {
            font-size: 0.9rem;
            color: #9ca3af;
            line-height: 1.4;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: #0f172a;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 24px;
            max-width: 500px;
            width: 90%;
            padding: 2rem;
            text-align: center;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1.25rem;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="depth-background"></div>

    <header class="hud-header">
        <a href="../../index.html" class="back-link">← Back to moedotfun</a>
        <div class="depth-hud">
            <div class="depth-value" id="hud-depth">0 meters</div>
            <div class="zone-name" id="hud-zone">Sunlit Zone</div>
        </div>
        <div></div>
    </header>

    <main class="ocean-column" id="ocean-column">
        <div class="ruler"></div>
    </main>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="creature-icon" id="m-icon"></div>
            <h2 class="creature-name" id="m-name"></h2>
            <div class="creature-depth-tag" id="m-depth"></div>
            <p class="creature-desc" id="m-desc" style="color: #e2e8f0; font-size: 1rem; margin-top: 1rem;"></p>
        </div>
    </div>

    <script>
        const oceanDepthMax = 11000;
        const columnHeight = 25000; // total px height

        const creatures = [
            { depth: 10, name: "Bottlenose Dolphin", icon: "🐬", zone: "Sunlit Zone", desc: "Playful aquatic mammal known for jumping high out of surface waters." },
            { depth: 40, name: "Scuba Diver Limit", icon: "🤿", zone: "Sunlit Zone", desc: "Recreational scuba diving max depth limit recommended for safety." },
            { depth: 150, name: "Blue Whale", icon: "🐳", zone: "Sunlit Zone", desc: "The largest animal ever known to have lived on Planet Earth." },
            { depth: 250, name: "Great White Shark", icon: "🦈", zone: "Twilight Zone", desc: "Apex predator lurking right at the edge of sunlight penetration." },
            { depth: 500, name: "Giant Pacific Octopus", icon: "🐙", zone: "Twilight Zone", desc: "Highly intelligent predator capable of instant camouflage and color change." },
            { depth: 900, name: "Giant Squid", icon: "🦑", zone: "Twilight Zone", desc: "Elusive sea monster reaching up to 13 meters in total length with eyes as big as dinner plates." },
            { depth: 1400, name: "Coelacanth", icon: "🐟", zone: "Midnight Zone", desc: "Prehistoric 'living fossil' fish thought to be extinct for 66 million years until rediscovered." },
            { depth: 2000, name: "Anglerfish", icon: "🎣", zone: "Midnight Zone", desc: "Uses a bioluminescent glowing lure dangling from its head to attract prey in pitch darkness." },
            { depth: 2500, name: "Vampire Squid", icon: "🦑", zone: "Midnight Zone", desc: "Produces bioluminescent glowing blue clouds instead of black ink to daze ocean predators." },
            { depth: 3800, name: "Wreck of the RMS Titanic", icon: "🚢", zone: "Midnight Zone", desc: "Rests silently on the ocean floor since sinking on April 15, 1912." },
            { depth: 5000, name: "Hydrothermal Vents", icon: "🌋", zone: "The Abyss", desc: "Superheated mineral vents spewing 400°C water that support weird chemosynthetic life." },
            { depth: 7500, name: "Barreleye Fish", icon: "🐟", zone: "The Trenches", desc: "Has a transparent fluid-filled head exposing green glowing tubular eyes inside." },
            { depth: 8178, name: "Mariana Snailfish", icon: "🐟", zone: "The Trenches", desc: "The deepest living fish ever recorded alive in ocean history, enduring crushing pressures." },
            { depth: 10928, name: "Challenger Deep", icon: "🕳️", zone: "The Trenches", desc: "The deepest known point in Earth's seabed oceans, located in the Mariana Trench." }
        ];

        const oceanColumn = document.getElementById('ocean-column');
        const depthBg = document.getElementById('depth-background');
        const hudDepth = document.getElementById('hud-depth');
        const hudZone = document.getElementById('hud-zone');

        // Render Zone banners & Creature Cards
        const zones = [
            { depth: 0, name: "Sunlit Zone (0 - 200m)" },
            { depth: 200, name: "Twilight Zone (200 - 1,000m)" },
            { depth: 1000, name: "Midnight Zone (1,000 - 4,000m)" },
            { depth: 4000, name: "The Abyss (4,000 - 6,000m)" },
            { depth: 6000, name: "The Trenches (6,000 - 11,000m)" }
        ];

        zones.forEach(z => {
            const py = (z.depth / oceanDepthMax) * (columnHeight - 200) + 100;
            const b = document.createElement('div');
            b.className = 'zone-banner';
            b.style.top = py + 'px';
            b.textContent = z.name;
            oceanColumn.appendChild(b);
        });

        creatures.forEach((c, idx) => {
            const py = (c.depth / oceanDepthMax) * (columnHeight - 200) + 120;
            const card = document.createElement('div');
            card.className = `creature-card ${idx % 2 === 0 ? 'left' : 'right'}`;
            card.style.top = py + 'px';
            card.innerHTML = `
                <div class="creature-icon">${c.icon}</div>
                <div class="creature-name">${c.name}</div>
                <div class="creature-depth-tag">${c.depth.toLocaleString()} meters (${(c.depth * 3.28084).toFixed(0).toLocaleString()} ft)</div>
                <div class="creature-desc">${c.desc}</div>
            `;
            card.onclick = () => openModal(c);
            oceanColumn.appendChild(card);
        });

        // Scroll calculations
        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const maxScroll = document.body.scrollHeight - window.innerHeight;
            const progress = Math.min(1, Math.max(0, scrollTop / maxScroll));

            const currentDepth = Math.round(progress * oceanDepthMax);
            hudDepth.textContent = `${currentDepth.toLocaleString()} meters`;

            // Color shift logic based on depth progress
            let bg;
            let zoneStr;
            let colorAccent;

            if (currentDepth < 200) {
                zoneStr = "Sunlit Zone";
                colorAccent = "#38bdf8";
                bg = `linear-gradient(180deg, #38bdf8 0%, #0284c7 100%)`;
            } else if (currentDepth < 1000) {
                zoneStr = "Twilight Zone";
                colorAccent = "#818cf8";
                bg = `linear-gradient(180deg, #0284c7 0%, #1e1b4b 100%)`;
            } else if (currentDepth < 4000) {
                zoneStr = "Midnight Zone";
                colorAccent = "#c084fc";
                bg = `linear-gradient(180deg, #1e1b4b 0%, #090d16 100%)`;
            } else if (currentDepth < 6000) {
                zoneStr = "The Abyss";
                colorAccent = "#f43f5e";
                bg = `linear-gradient(180deg, #090d16 0%, #030712 100%)`;
            } else {
                zoneStr = "The Trenches (Hadal)";
                colorAccent = "#22c55e";
                bg = `radial-gradient(circle at center, #0a0f1d 0%, #000000 100%)`;
            }

            depthBg.style.background = bg;
            hudZone.textContent = zoneStr;
            document.documentElement.style.setProperty('--depth-color', colorAccent);
        });

        function openModal(c) {
            document.getElementById('m-icon').textContent = c.icon;
            document.getElementById('m-name').textContent = c.name;
            document.getElementById('m-depth').textContent = `${c.depth.toLocaleString()} meters depth`;
            document.getElementById('m-desc').textContent = c.desc;
            document.getElementById('modal-overlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('active');
        }
    </script>
</body>
</html>
