<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planets | moe.fun</title>
    <link rel="icon" href="../../assets/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #f3ede0;
            --paper-alt: #e9e1d0;
            --ink: #16181a;
            --ink-muted: #646158;
            --rule: #cbc2b0;
            --void: #07090d;
            --vermilion: #c24b28;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Space Mono', monospace;
            background: var(--paper);
            color: var(--ink);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--paper);
            border-bottom: 1.5px solid var(--ink);
            padding: 0.6rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: baseline;
            gap: 1.15rem;
        }

        .back-link {
            color: var(--ink-muted);
            text-decoration: none;
            font-size: 0.75rem;
            border-bottom: 1px solid transparent;
        }
        .back-link:hover { color: var(--ink); border-color: var(--ink); }

        .header-title {
            font-family: 'Instrument Serif', serif;
            font-size: 1.7rem;
            font-weight: 400;
            line-height: 1;
        }

        .header-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 0.4rem 0.75rem;
            border: 1.5px solid var(--ink);
            background: var(--paper);
            color: var(--ink);
            cursor: pointer;
            transition: background 0.12s, color 0.12s;
        }
        .btn:hover { background: var(--ink); color: var(--paper); }
        .btn.accent {
            background: var(--vermilion);
            border-color: var(--vermilion);
            color: #fff9f2;
        }
        .btn.accent:hover { background: #a73d1e; border-color: #a73d1e; }

        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 290px;
            min-height: 0;
        }

        .viewport {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--void);
        }

        .viewport canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        .viewport canvas:active { cursor: grabbing; }

        .reticle {
            position: absolute;
            width: 16px;
            height: 16px;
            border-color: rgba(243, 237, 224, 0.28);
            border-style: solid;
            pointer-events: none;
        }
        .rc-tl { top: 14px; left: 14px; border-width: 1.5px 0 0 1.5px; }
        .rc-tr { top: 14px; right: 14px; border-width: 1.5px 1.5px 0 0; }
        .rc-bl { bottom: 14px; left: 14px; border-width: 0 0 1.5px 1.5px; }
        .rc-br { bottom: 14px; right: 14px; border-width: 0 1.5px 1.5px 0; }

        .plate-caption {
            position: absolute;
            bottom: 16px;
            left: 22px;
            color: rgba(243, 237, 224, 0.5);
            font-size: 0.65rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            pointer-events: none;
        }

        .sidebar {
            background: var(--paper);
            border-left: 1.5px solid var(--ink);
            padding: 1rem 1.1rem 1.25rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .dossier-head {
            border-bottom: 1.5px solid var(--ink);
            padding-bottom: 0.65rem;
        }
        .planet-name {
            font-family: 'Instrument Serif', serif;
            font-size: 1.85rem;
            line-height: 1;
            font-weight: 400;
        }
        .planet-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
            font-size: 0.65rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .planet-class { color: var(--vermilion); font-weight: 700; }
        .planet-seed { color: var(--ink-muted); }

        .section-label {
            font-size: 0.64rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--ink-muted);
            margin-bottom: 0.4rem;
        }

        .pill-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.32rem;
        }
        .pill-btn {
            font-family: 'Space Mono', monospace;
            font-size: 0.66rem;
            padding: 0.38rem 0.2rem;
            border: 1px solid #bdb3a1;
            background: var(--paper-alt);
            color: var(--ink);
            cursor: pointer;
            text-align: center;
        }
        .pill-btn:hover { border-color: var(--ink); }
        .pill-btn.active {
            background: var(--ink);
            border-color: var(--ink);
            color: var(--paper);
        }

        .slider-list {
            display: flex;
            flex-direction: column;
            gap: 0.68rem;
        }
        .slider-item {
            display: flex;
            flex-direction: column;
            gap: 0.24rem;
        }
        .slider-head {
            display: flex;
            justify-content: space-between;
            font-size: 0.68rem;
        }
        .slider-val { color: var(--ink-muted); }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 2px;
            background: #bdb3a1;
            outline: none;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 9px;
            height: 13px;
            background: var(--ink);
            cursor: pointer;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--rule);
            padding-top: 0.7rem;
            font-size: 0.7rem;
        }
        .check-btn {
            font-family: 'Space Mono', monospace;
            font-size: 0.66rem;
            font-weight: 700;
            padding: 0.24rem 0.6rem;
            border: 1.5px solid var(--ink);
            background: var(--ink);
            color: var(--paper);
            cursor: pointer;
        }
        .check-btn.off {
            background: var(--paper);
            color: var(--ink-muted);
            border-color: #bdb3a1;
        }

        @media (max-width: 820px) {
            body { height: auto; overflow: auto; }
            .workspace { grid-template-columns: 1fr; }
            .viewport { height: 58vh; min-height: 360px; }
            .sidebar { border-left: none; border-top: 1.5px solid var(--ink); }
        }
    </style>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // ── Shaders (Simplex 3D + displaced sphere + tangent-space bump + 5-layer biome ramp) ──
        const NOISE_GLSL = `
            vec4 permute(vec4 x){ return mod(((x * 34.0) + 1.0) * x, 289.0); }
            vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }

            float simplex3(vec3 v) {
                const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
                const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

                vec3 i  = floor(v + dot(v, C.yyy));
                vec3 x0 = v - i + dot(i, C.xxx);

                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min(g.xyz, l.zxy);
                vec3 i2 = max(g.xyz, l.zxy);

                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + 2.0 * C.xxx;
                vec3 x3 = x0 - 1.0 + 3.0 * C.xxx;

                i = mod(i, 289.0);
                vec4 p = permute(permute(permute(
                          i.z + vec4(0.0, i1.z, i2.z, 1.0))
                        + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                        + i.x + vec4(0.0, i1.x, i2.x, 1.0));

                float n_ = 1.0 / 7.0;
                vec3 ns = n_ * D.wyz - D.xzx;

                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_);

                vec4 x = x_ * ns.x + ns.yyyy;
                vec4 y = y_ * ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);

                vec4 b0 = vec4(x.xy, y.xy);
                vec4 b1 = vec4(x.zw, y.zw);

                vec4 s0 = floor(b0) * 2.0 + 1.0;
                vec4 s1 = floor(b1) * 2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));

                vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
                vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;

                vec3 p0 = vec3(a0.xy, h.x);
                vec3 p1 = vec3(a0.zw, h.y);
                vec3 p2 = vec3(a1.xy, h.z);
                vec3 p3 = vec3(a1.zw, h.w);

                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;

                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot(m * m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
            }

            float fractal3(vec3 v, float period, float persistence, float lacunarity, int octaves) {
                float n = 0.0;
                float a = 1.0;
                float max_amp = 0.0;
                float P = period;
                for (int i = 0; i < 10; i++) {
                    if (i >= octaves) break;
                    n += a * simplex3(v / P);
                    a *= persistence;
                    max_amp += a;
                    P /= lacunarity;
                }
                return n / max_amp;
            }

            float terrainHeight(
                int type, vec3 v, vec3 seedOffset,
                float amplitude, float sharpness, float offset,
                float period, float persistence, float lacunarity, int octaves
            ) {
                vec3 sv = v + seedOffset;
                float h = 0.0;
                if (type == 1) {
                    h = amplitude * (simplex3(sv / period) * 0.5 + 0.5);
                } else if (type == 2) {
                    h = amplitude * fractal3(sv, period, persistence, lacunarity, octaves);
                    h = amplitude * pow(max(0.0, (h + 1.0) * 0.5), sharpness);
                } else {
                    h = fractal3(sv, period, persistence, lacunarity, octaves);
                    h = amplitude * pow(max(0.0, 1.0 - abs(h)), sharpness);
                }
                return max(0.0, h + offset);
            }
        `;

        const PLANET_VERT = `
            attribute vec3 tangent;

            uniform int type;
            uniform float radius;
            uniform vec3 seedOffset;
            uniform float amplitude;
            uniform float sharpness;
            uniform float offset;
            uniform float period;
            uniform float persistence;
            uniform float lacunarity;
            uniform int octaves;

            varying vec3 fragPosition;
            varying vec3 fragNormal;
            varying vec3 fragTangent;
            varying vec3 fragBitangent;

            ${NOISE_GLSL}

            void main() {
                float h = terrainHeight(type, position, seedOffset, amplitude, sharpness, offset, period, persistence, lacunarity, octaves);
                vec3 pos = position * (radius + h);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                fragPosition = position;
                fragNormal = normal;
                fragTangent = tangent;
                fragBitangent = cross(normal, tangent);
            }
        `;

        const PLANET_FRAG = `
            uniform int type;
            uniform float radius;
            uniform vec3 seedOffset;
            uniform float amplitude;
            uniform float sharpness;
            uniform float offset;
            uniform float period;
            uniform float persistence;
            uniform float lacunarity;
            uniform int octaves;

            uniform vec3 color1;
            uniform vec3 color2;
            uniform vec3 color3;
            uniform vec3 color4;
            uniform vec3 color5;
            uniform float transition2;
            uniform float transition3;
            uniform float transition4;
            uniform float transition5;
            uniform float blend12;
            uniform float blend23;
            uniform float blend34;
            uniform float blend45;

            uniform float bumpStrength;
            uniform float bumpOffset;

            uniform float ambientIntensity;
            uniform float diffuseIntensity;
            uniform float specularIntensity;
            uniform float shininess;
            uniform vec3 lightDirection;
            uniform vec3 lightColor;
            uniform vec3 rimColor;
            uniform float rimStrength;
            uniform float emissiveLow;

            varying vec3 fragPosition;
            varying vec3 fragNormal;
            varying vec3 fragTangent;
            varying vec3 fragBitangent;

            ${NOISE_GLSL}

            void main() {
                float h = terrainHeight(type, fragPosition, seedOffset, amplitude, sharpness, offset, period, persistence, lacunarity, octaves);

                vec3 dx = bumpOffset * fragTangent;
                float h_dx = terrainHeight(type, fragPosition + dx, seedOffset, amplitude, sharpness, offset, period, persistence, lacunarity, octaves);

                vec3 dy = bumpOffset * fragBitangent;
                float h_dy = terrainHeight(type, fragPosition + dy, seedOffset, amplitude, sharpness, offset, period, persistence, lacunarity, octaves);

                vec3 pos = fragPosition * (radius + h);
                vec3 pos_dx = (fragPosition + dx) * (radius + h_dx);
                vec3 pos_dy = (fragPosition + dy) * (radius + h_dy);

                vec3 bumpNormal = normalize(cross(pos_dx - pos, pos_dy - pos));
                vec3 N = normalize(mix(fragNormal, bumpNormal, bumpStrength));

                vec3 L = normalize(-lightDirection);
                vec3 V = normalize(cameraPosition - pos);
                vec3 R = normalize(reflect(L, N));

                float ndl = max(0.0, dot(N, -L));
                float diffuse = diffuseIntensity * ndl;

                float specularFalloff = clamp((transition3 - h) / max(transition3, 0.001), 0.0, 1.0);
                float specular = max(0.0, specularFalloff * specularIntensity * pow(max(0.0, dot(V, R)), shininess));

                float light = ambientIntensity + diffuse + specular;

                vec3 c12   = mix(color1, color2, smoothstep(transition2 - blend12, transition2 + blend12, h));
                vec3 c123  = mix(c12,    color3, smoothstep(transition3 - blend23, transition3 + blend23, h));
                vec3 c1234 = mix(c123,   color4, smoothstep(transition4 - blend34, transition4 + blend34, h));
                vec3 finalColor = mix(c1234, color5, smoothstep(transition5 - blend45, transition5 + blend45, h));

                vec3 shaded = light * finalColor * lightColor;

                // Optional emissive lava/glow on lowest layer
                if (emissiveLow > 0.01) {
                    float lavaMask = 1.0 - smoothstep(transition2 - blend12, transition2 + blend12, h);
                    shaded += color1 * lavaMask * emissiveLow;
                }

                // Subtle Fresnel atmospheric rim
                float fresnel = pow(1.0 - max(dot(normalize(fragNormal), V), 0.0), 3.2);
                float sunRim = smoothstep(-0.25, 0.75, dot(normalize(fragNormal), -L));
                shaded += rimColor * fresnel * rimStrength * (0.15 + 0.85 * sunRim);

                gl_FragColor = vec4(shaded, 1.0);
            }
        `;

        const ATMO_VERT = `
            attribute float size;
            varying vec3 fragPosition;
            void main() {
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                gl_PointSize = size * (55.0 / max(1.0, -mvPosition.z));
                gl_Position = projectionMatrix * mvPosition;
                fragPosition = (modelMatrix * vec4(position, 1.0)).xyz;
            }
        `;

        const ATMO_FRAG = `
            uniform float time;
            uniform float speed;
            uniform float opacity;
            uniform float density;
            uniform float scale;
            uniform vec3 lightDirection;
            uniform vec3 color;
            uniform sampler2D pointTexture;
            varying vec3 fragPosition;

            ${NOISE_GLSL}

            void main() {
                vec3 R = normalize(fragPosition);
                vec3 L = normalize(lightDirection);
                float light = max(0.05, dot(R, L));
                float n = simplex3((time * speed) + fragPosition / scale);
                float alpha = opacity * clamp(n + density, 0.0, 1.0);
                vec4 tex = texture2D(pointTexture, gl_PointCoord);
                gl_FragColor = vec4(light * color, alpha) * tex;
            }
        `;

        // Procedural soft cloud puff texture (zero external image files)
        function createCloudTexture() {
            const c = document.createElement('canvas');
            c.width = 64; c.height = 64;
            const ctx = c.getContext('2d');
            const g = ctx.createRadialGradient(32, 32, 2, 32, 32, 32);
            g.addColorStop(0, 'rgba(255,255,255,0.85)');
            g.addColorStop(0.45, 'rgba(255,255,255,0.32)');
            g.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(c);
        }

        // Procedural starfield sphere
        function createStarfield() {
            const count = 2400;
            const pos = new Float32Array(count * 3);
            const col = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                const u = Math.random();
                const v = Math.random();
                const theta = 2 * Math.PI * u;
                const phi = Math.acos(2 * v - 1);
                const r = 240 + Math.random() * 140;
                pos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
                pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                pos[i * 3 + 2] = r * Math.cos(phi);

                const tint = Math.random();
                const c = tint > 0.7 ? new THREE.Color(0xffe6c2) : tint > 0.35 ? new THREE.Color(0xdbe8ff) : new THREE.Color(0xffffff);
                const b = 0.35 + Math.random() * 0.65;
                col[i * 3] = c.r * b; col[i * 3 + 1] = c.g * b; col[i * 3 + 2] = c.b * b;
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
            const mat = new THREE.PointsMaterial({ size: 1.15, vertexColors: true, transparent: true, opacity: 0.9, sizeAttenuation: true });
            return new THREE.Points(geo, mat);
        }

        // ── Presets ──
        const PRESETS = {
            terran: {
                label: 'TERRAN', type: 2, amplitude: 1.19, sharpness: 2.6, offset: -0.016, period: 0.6,
                colors: [[0.014,0.117,0.279], [0.080,0.527,0.351], [0.620,0.516,0.372], [0.149,0.254,0.084], [0.85,0.88,0.90]],
                transitions: [0.071, 0.215, 0.372, 1.15], blends: [0.12, 0.14, 0.10, 0.18],
                specular: 2.0, clouds: 0.35, cloudColor: [1,1,1], rimColor: [0.28,0.58,0.95], rimStrength: 0.55, emissiveLow: 0.0
            },
            arid: {
                label: 'ARID', type: 3, amplitude: 1.35, sharpness: 2.2, offset: -0.08, period: 0.72,
                colors: [[0.24,0.10,0.06], [0.54,0.24,0.12], [0.76,0.44,0.22], [0.84,0.62,0.38], [0.92,0.84,0.74]],
                transitions: [0.08, 0.28, 0.58, 1.15], blends: [0.10, 0.14, 0.16, 0.18],
                specular: 0.25, clouds: 0.12, cloudColor: [0.95,0.78,0.62], rimColor: [0.90,0.48,0.24], rimStrength: 0.42, emissiveLow: 0.0
            },
            cryo: {
                label: 'CRYO', type: 3, amplitude: 1.25, sharpness: 2.8, offset: -0.02, period: 0.65,
                colors: [[0.05,0.16,0.28], [0.14,0.38,0.54], [0.58,0.76,0.88], [0.82,0.91,0.96], [0.96,0.98,1.0]],
                transitions: [0.08, 0.24, 0.52, 1.05], blends: [0.10, 0.12, 0.14, 0.16],
                specular: 2.4, clouds: 0.28, cloudColor: [0.86,0.94,1.0], rimColor: [0.46,0.82,0.98], rimStrength: 0.6, emissiveLow: 0.0
            },
            volcanic: {
                label: 'VOLCANIC', type: 3, amplitude: 1.45, sharpness: 3.1, offset: -0.05, period: 0.58,
                colors: [[1.0,0.32,0.04], [0.55,0.10,0.03], [0.16,0.13,0.13], [0.24,0.20,0.19], [0.42,0.36,0.33]],
                transitions: [0.09, 0.22, 0.55, 1.15], blends: [0.07, 0.10, 0.14, 0.18],
                specular: 0.4, clouds: 0.22, cloudColor: [0.45,0.35,0.30], rimColor: [0.95,0.34,0.12], rimStrength: 0.5, emissiveLow: 1.4
            },
            exobio: {
                label: 'EXO-BIO', type: 2, amplitude: 1.22, sharpness: 2.4, offset: -0.01, period: 0.62,
                colors: [[0.04,0.18,0.22], [0.08,0.46,0.44], [0.52,0.28,0.48], [0.22,0.56,0.42], [0.82,0.88,0.76]],
                transitions: [0.08, 0.22, 0.44, 1.1], blends: [0.12, 0.14, 0.14, 0.18],
                specular: 1.8, clouds: 0.38, cloudColor: [0.88,0.98,0.95], rimColor: [0.26,0.82,0.72], rimStrength: 0.62, emissiveLow: 0.0
            },
            barren: {
                label: 'BARREN', type: 3, amplitude: 1.5, sharpness: 2.0, offset: 0.02, period: 0.55,
                colors: [[0.18,0.18,0.19], [0.32,0.31,0.30], [0.48,0.46,0.44], [0.64,0.62,0.59], [0.80,0.78,0.75]],
                transitions: [0.15, 0.38, 0.72, 1.25], blends: [0.12, 0.14, 0.14, 0.18],
                specular: 0.1, clouds: 0.0, cloudColor: [1,1,1], rimColor: [0.5,0.5,0.55], rimStrength: 0.15, emissiveLow: 0.0
            }
        };

        const PREFIXES = ['Aurelia', 'Kepler', 'Vespera', 'Novara', 'Solis', 'Calypso', 'Hyperion', 'Thalassa', 'Lyra', 'Kestrel'];
        const SUFFIXES = ['Prime', 'IV', 'IX', '442b', 'Major', 'VII', 'Reach'];

        // ── Scene Setup ──
        const viewport = document.getElementById('viewport');
        const clock = new THREE.Clock(true);

        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(viewport.clientWidth, viewport.clientHeight);
        viewport.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x07090d);
        scene.add(createStarfield());

        const camera = new THREE.PerspectiveCamera(50, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
        camera.position.set(0, 4, 58);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.enablePan = false;
        controls.minDistance = 30;
        controls.maxDistance = 110;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.45;

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(viewport.clientWidth, viewport.clientHeight), 0.18, 0.5, 0.15);
        composer.addPass(bloomPass);
        composer.addPass(new OutputPass());

        // ── Planet Uniforms & Mesh ──
        const planetParams = {
            type: { value: 2 },
            radius: { value: 20.0 },
            seedOffset: { value: new THREE.Vector3(0, 0, 0) },
            amplitude: { value: 1.19 },
            sharpness: { value: 2.6 },
            offset: { value: -0.016 },
            period: { value: 0.6 },
            persistence: { value: 0.484 },
            lacunarity: { value: 1.8 },
            octaves: { value: 9 },
            ambientIntensity: { value: 0.03 },
            diffuseIntensity: { value: 1.05 },
            specularIntensity: { value: 2.0 },
            shininess: { value: 12.0 },
            lightDirection: { value: new THREE.Vector3(1, 0.55, 1).normalize() },
            lightColor: { value: new THREE.Color(0xffffff) },
            bumpStrength: { value: 1.0 },
            bumpOffset: { value: 0.0012 },
            color1: { value: new THREE.Color(0.014, 0.117, 0.279) },
            color2: { value: new THREE.Color(0.080, 0.527, 0.351) },
            color3: { value: new THREE.Color(0.620, 0.516, 0.372) },
            color4: { value: new THREE.Color(0.149, 0.254, 0.084) },
            color5: { value: new THREE.Color(0.85, 0.88, 0.90) },
            transition2: { value: 0.071 },
            transition3: { value: 0.215 },
            transition4: { value: 0.372 },
            transition5: { value: 1.15 },
            blend12: { value: 0.12 },
            blend23: { value: 0.14 },
            blend34: { value: 0.10 },
            blend45: { value: 0.18 },
            rimColor: { value: new THREE.Color(0.28, 0.58, 0.95) },
            rimStrength: { value: 0.55 },
            emissiveLow: { value: 0.0 }
        };

        const planetGeo = new THREE.SphereGeometry(1, 144, 144);
        planetGeo.computeTangents();
        const planetMat = new THREE.ShaderMaterial({
            uniforms: planetParams,
            vertexShader: PLANET_VERT,
            fragmentShader: PLANET_FRAG
        });
        const planet = new THREE.Mesh(planetGeo, planetMat);
        scene.add(planet);

        // ── Volumetric Cloud Particle Atmosphere ──
        const atmoParams = {
            time: { value: 0 },
            pointTexture: { value: createCloudTexture() },
            opacity: { value: 0.35 },
            density: { value: 0.05 },
            scale: { value: 8.5 },
            color: { value: new THREE.Color(0xffffff) },
            speed: { value: 0.03 },
            lightDirection: planetParams.lightDirection
        };

        function createAtmosphere() {
            const count = 3600;
            const verts = new Float32Array(count * 3);
            const sizes = new Float32Array(count);
            const p = new THREE.Vector3();
            for (let i = 0; i < count; i++) {
                p.set(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1).normalize();
                const r = 21.1 + Math.random() * 1.4;
                p.multiplyScalar(r);
                verts[i * 3] = p.x; verts[i * 3 + 1] = p.y; verts[i * 3 + 2] = p.z;
                sizes[i] = 42 + Math.random() * 48;
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
            geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            const mat = new THREE.ShaderMaterial({
                uniforms: atmoParams,
                vertexShader: ATMO_VERT,
                fragmentShader: ATMO_FRAG,
                blending: THREE.NormalBlending,
                depthWrite: false,
                transparent: true
            });
            return new THREE.Points(geo, mat);
        }

        const atmosphere = createAtmosphere();
        planet.add(atmosphere);

        // ── UI Wiring ──
        let currentSeed = 4821;
        let sunAngleDeg = 45;

        function updateSun(deg) {
            sunAngleDeg = deg;
            const rad = (deg * Math.PI) / 180;
            planetParams.lightDirection.value.set(Math.sin(rad), 0.42, Math.cos(rad)).normalize();
        }

        function syncUI() {
            const set = (id, vId, v, fmt) => {
                document.getElementById(id).value = v;
                document.getElementById(vId).textContent = fmt(v);
            };
            set('sl-amp', 'val-amp', planetParams.amplitude.value, v => Number(v).toFixed(2));
            set('sl-sharp', 'val-sharp', planetParams.sharpness.value, v => Number(v).toFixed(2));
            set('sl-offset', 'val-offset', planetParams.offset.value, v => Number(v).toFixed(2));
            set('sl-period', 'val-period', planetParams.period.value, v => Number(v).toFixed(2));
            set('sl-bump', 'val-bump', planetParams.bumpStrength.value, v => Math.round(v * 100) + '%');
            set('sl-clouds', 'val-clouds', atmoParams.opacity.value, v => Math.round(v * 100) + '%');
            set('sl-sun', 'val-sun', sunAngleDeg, v => Math.round(v) + '°');
            document.getElementById('planet-seed').textContent = '#' + currentSeed;
            document.querySelectorAll('#type-grid .pill-btn').forEach(b => {
                b.classList.toggle('active', Number(b.dataset.type) === planetParams.type.value);
            });
        }

        function applyPreset(key) {
            const p = PRESETS[key];
            if (!p) return;
            planetParams.type.value = p.type;
            planetParams.amplitude.value = p.amplitude;
            planetParams.sharpness.value = p.sharpness;
            planetParams.offset.value = p.offset;
            planetParams.period.value = p.period;
            planetParams.specularIntensity.value = p.specular;
            planetParams.color1.value.setRGB(...p.colors[0]);
            planetParams.color2.value.setRGB(...p.colors[1]);
            planetParams.color3.value.setRGB(...p.colors[2]);
            planetParams.color4.value.setRGB(...p.colors[3]);
            planetParams.color5.value.setRGB(...p.colors[4]);
            planetParams.transition2.value = p.transitions[0];
            planetParams.transition3.value = p.transitions[1];
            planetParams.transition4.value = p.transitions[2];
            planetParams.transition5.value = p.transitions[3];
            planetParams.blend12.value = p.blends[0];
            planetParams.blend23.value = p.blends[1];
            planetParams.blend34.value = p.blends[2];
            planetParams.blend45.value = p.blends[3];
            planetParams.rimColor.value.setRGB(...p.rimColor);
            planetParams.rimStrength.value = p.rimStrength;
            planetParams.emissiveLow.value = p.emissiveLow;
            atmoParams.opacity.value = p.clouds;
            atmoParams.color.value.setRGB(...p.cloudColor);
            atmosphere.visible = p.clouds > 0.005;

            document.getElementById('planet-class').textContent = p.label;
            document.querySelectorAll('#preset-grid .pill-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.preset === key);
            });
            syncUI();
        }

        document.querySelectorAll('#preset-grid .pill-btn').forEach(btn => {
            btn.addEventListener('click', () => applyPreset(btn.dataset.preset));
        });

        document.querySelectorAll('#type-grid .pill-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                planetParams.type.value = Number(btn.dataset.type);
                syncUI();
            });
        });

        const bindSlider = (id, vId, fn, fmt) => {
            document.getElementById(id).addEventListener('input', e => {
                const v = Number(e.target.value);
                fn(v);
                document.getElementById(vId).textContent = fmt(v);
            });
        };
        bindSlider('sl-amp', 'val-amp', v => planetParams.amplitude.value = v, v => v.toFixed(2));
        bindSlider('sl-sharp', 'val-sharp', v => planetParams.sharpness.value = v, v => v.toFixed(2));
        bindSlider('sl-offset', 'val-offset', v => planetParams.offset.value = v, v => v.toFixed(2));
        bindSlider('sl-period', 'val-period', v => planetParams.period.value = v, v => v.toFixed(2));
        bindSlider('sl-bump', 'val-bump', v => planetParams.bumpStrength.value = v, v => Math.round(v * 100) + '%');
        bindSlider('sl-clouds', 'val-clouds', v => {
            atmoParams.opacity.value = v;
            atmosphere.visible = v > 0.005;
        }, v => Math.round(v * 100) + '%');
        bindSlider('sl-sun', 'val-sun', v => updateSun(v), v => Math.round(v) + '°');

        document.getElementById('toggle-spin').addEventListener('click', e => {
            controls.autoRotate = !controls.autoRotate;
            e.currentTarget.textContent = controls.autoRotate ? 'ON' : 'OFF';
            e.currentTarget.classList.toggle('off', !controls.autoRotate);
        });

        document.getElementById('btn-randomize').addEventListener('click', () => {
            const keys = Object.keys(PRESETS);
            const pick = keys[Math.floor(Math.random() * keys.length)];
            currentSeed = 1000 + Math.floor(Math.random() * 8999);
            planetParams.seedOffset.value.set(
                (Math.random() - 0.5) * 40,
                (Math.random() - 0.5) * 40,
                (Math.random() - 0.5) * 40
            );
            applyPreset(pick);
            planetParams.amplitude.value = Math.max(0.4, Math.min(2.0, planetParams.amplitude.value + (Math.random() - 0.5) * 0.4));
            planetParams.period.value = Math.max(0.35, Math.min(1.4, planetParams.period.value + (Math.random() - 0.5) * 0.3));
            updateSun(Math.floor(Math.random() * 140) - 70);
            document.getElementById('planet-name').textContent =
                PREFIXES[currentSeed % PREFIXES.length] + ' ' + SUFFIXES[(currentSeed >> 3) % SUFFIXES.length];
            syncUI();
        });

        document.getElementById('btn-snapshot').addEventListener('click', () => {
            composer.render();
            const a = document.createElement('a');
            a.download = document.getElementById('planet-name').textContent.toLowerCase().replace(/\s+/g, '-') + '.png';
            a.href = renderer.domElement.toDataURL('image/png');
            a.click();
        });

        window.addEventListener('resize', () => {
            const w = viewport.clientWidth;
            const h = viewport.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            composer.setSize(w, h);
        });

        updateSun(sunAngleDeg);
        syncUI();

        function animate() {
            requestAnimationFrame(animate);
            atmoParams.time.value = clock.getElapsedTime();
            atmosphere.rotation.y += 0.00025;
            controls.update();
            composer.render();
        }
        animate();
    </script>
</body>
</html>
