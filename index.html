<!DOCTYPE html>

    <title>Moe's Playground | moedotfun</title>
    <meta name="description" content="Minimalist curiosity-driven web experiments, simulations, and apps inspired by Hacker News.">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="hn-header">
        <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
            <a href="index.html" class="hn-brand">
                <span class="hn-logo">m</span>
                <span class="hn-title">moedotfun</span>
            </a>

            <nav class="hn-nav" id="hn-nav">
                <span class="hn-nav-item active" data-category="All">all</span>
                <span class="hn-nav-sep">|</span>
                <span class="hn-nav-item" data-category="Simulation">simulations</span>
                <span class="hn-nav-sep">|</span>

                <span class="hn-nav-sep">|</span>

        <p>
            <a href="index.html">moedotfun</a> |
